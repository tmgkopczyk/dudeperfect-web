<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Dude Perfect Fan Archive{% endblock %}</title>
  <meta name="description" content="{% block description %}Explore songs, artists, and videos used in Dude Perfect content.{% endblock %}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#F9FAFB] text-[#1F1F1F] min-h-screen flex flex-col">

  <!-- Header / Nav -->
  <header class="bg-[#1F1F1F] text-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center gap-6">

      <!-- Brand -->
      <a href="/" class="font-semibold text-[#2EFCE6] hover:text-[#22D3C5]">Dude Perfect Fan Archive</a>

      <!-- Nav links -->
      <nav class="ml-auto flex items-center gap-4 sm:gap-6 text-sm sm:text-base">

        <!-- Songs -->
        <a href="/songs" class="hover:text-[#2EFCE6]">Songs</a>

        <!-- Artists -->
        <a href="/artists" class="hover:text-[#2EFCE6]">Artists</a>

        <!-- Videos -->
        <div class="relative group">
          <a href="/videos" class="flex items-center gap-1 hover:text-[#2EFCE6]">
            Videos
            <span class="text-xs">▾</span>
          </a>

          <!-- Videos dropdown -->
          <div class="invisible absolute right-0 top-full z-50 pt-3 opacity-0 transition group-hover:visible group-hover:opacity-100 group-focus-within:visible group-focus-within:opacity-100">
            <div class="w-48 overflow-hidden rounded-lg border border-neutral-700 bg-[#1F1F1F] shadow-lg">
              <a href="/videos" class="block px-4 py-3 hover:bg-neutral-800 hover:text-[#2EFCE6]">All Videos</a>
              <a href="/videos/categories" class="block px-4 py-3 hover:bg-neutral-800 hover:text-[#2EFCE6]">Video Categories</a>
            </div>
          </div>
        </div>

        <!-- Stereotypes -->
        <div class="relative group">
          <a href="/stereotypes" class="flex items-center gap-1 hover:text-[#2EFCE6]">
            Stereotypes
            <span class="text-xs">▾</span>
          </a>

          <!-- Stereotypes dropdown -->
          <div class="invisible absolute right-0 top-full z-50 pt-3 opacity-0 transition group-hover:visible group-hover:opacity-100 group-focus-within:visible group-focus-within:opacity-100">
            <div class="w-56 overflow-hidden rounded-lg border border-neutral-700 bg-[#1F1F1F] shadow-lg">
              <a href="/stereotypes" class="block px-4 py-3 hover:bg-neutral-800 hover:text-[#2EFCE6]">Episodes</a>
              <a href="/stereotypes/recurring" class="block px-4 py-3 hover:bg-neutral-800 hover:text-[#2EFCE6]">Recurring Stereotypes</a>
              <a href="/stereotypes/performers" class="block px-4 py-3 hover:bg-neutral-800 hover:text-[#2EFCE6]">Performers</a>
            </div>
          </div>
        </div>

        <!-- Players -->
        <a href="/players" class="hover:text-[#2EFCE6]">Players</a>

        <!-- Forums -->
        <a href="https://forums.dudeperfectfanarchive.com" class="hover:text-[#2EFCE6]">Forums</a>

        <!-- Contact -->
        <a href="/contact" class="text-gray-400 hover:text-[#2EFCE6]">Contact</a>

      </nav>

    </div>
  </header>

  <!-- Main content -->
  <main class="flex-grow">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-sm text-gray-500 text-center space-y-2">
      <p>
        Fan-run project. Not affiliated with Dude Perfect.
      </p>
      <p>
        <a href="/contact" class="underline hover:text-gray-700">
          Questions, corrections, or suggestions?
        </a>
      </p>
    </div>
  </footer>

</body>
</html>
