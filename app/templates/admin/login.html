{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<section class="max-w-md mx-auto space-y-6">

  <h1 class="text-3xl font-semibold">
    Admin Login
  </h1>

  {% if error %}
    <div class="border border-red-300 bg-red-50 text-red-700 p-3 rounded">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" class="space-y-4">

    <div>
      <label class="block text-sm font-medium">
        Username
      </label>

      <input
        type="text"
        name="username"
        required
        class="w-full border rounded px-3 py-2"
      >
    </div>

    <div>
        <label class="block text-sm font-medium">
            Password
        </label>

        <input
            type="password"
            name="password"
            required
            class="w-full border rounded px-3 py-2"
        >
    </div>

    <button
    type="submit"
    class="px-4 py-2 rounded bg-[#2EFCE6] text-black font-semibold"
    >
    Login
    </button>

  </form>

</section>
{% endblock %}
